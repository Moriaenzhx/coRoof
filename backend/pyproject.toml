[project]
name = "coroof-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0.38,<2.1",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "celery[redis]>=5.4,<6",
  "email-validator>=2.2,<3",
  "httpx>=0.28,<1",
  "cryptography>=46,<51",
  "langchain>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "langchain-anthropic>=1.0,<2",
  "langchain-google-genai>=4.0,<5",
  "langchain-deepseek>=1.0,<2",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-postgres>=3,<4",
  "langgraph-checkpoint-sqlite>=3,<4",
  "anthropic>=0.120,<1",
  "python-gitlab>=8.6,<9",
  "tenacity>=9,<10",
  "langchain-text-splitters>=1,<2",
  "jieba>=0.42.1,<1",
  "rank-bm25>=0.2.2,<0.3",
  "pypdf>=6,<7",
  "python-docx>=1.2,<2",
  "authlib>=1.6,<2",
  "itsdangerous>=2.2,<3",
  "limits[redis]>=5,<6",
  "aiosmtplib>=5,<6",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=8.3",
    "mypy>=1.15",
    "types-redis>=4.6",
    "responses>=0.25,<1",
    "aiosmtpd>=1.4,<2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app", "worker"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests", "migrations"]

[[tool.mypy.overrides]]
module = ["celery.*", "jieba.*", "authlib.*", "rank_bm25"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
