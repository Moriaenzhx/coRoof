[project]
name = "coroof-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0.38,<2.1", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4",
  "celery[redis]>=5.4,<6", "email-validator>=2.2,<3",
]

[dependency-groups]
dev = ["ruff>=0.9", "pytest>=8.3", "httpx>=0.28", "mypy>=1.15", "types-redis>=4.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests", "migrations"]

[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
